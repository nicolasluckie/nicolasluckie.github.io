<!DOCTYPE html>
<html lang="en">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />
    <title>Happy 2 Months!</title>
    <!-- Google Font -->

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap"
      rel="stylesheet"
    />
    <!-- Stylesheet -->
    <style>
      * {
        padding: 0;
        margin: 0;
        font-family: "Poppins", sans-serif;
      }
      audio {
        visibility: hidden;
      }
      html,
      body {
        max-width: 100%;
        overflow-x: hidden;
      }
      body {
        background-color: #bddaff;
      }
      .container {
        height: 450px;
        width: 600px;
        position: absolute;
        transform: translate(-50%, -50%);
        left: 50%;
        top: 50%;
      }
      .container:hover .overlay {
        height: 100%;
      }
      .shapes {
        height: 250px;
        width: 250px;
        background: linear-gradient(45deg, #07b516, #80fa8a);
        border-radius: 50%;
        position: absolute;
        right: 0;
      }
      .shapes:before {
        content: "";
        position: absolute;
        height: 250px;
        width: 250px;
        top: 197px;
        background: linear-gradient(45deg, #b50707, #fa8080);
        border-radius: 50%;
        right: 347px;
      }
      .card {
        position: absolute;
        height: 350px;
        width: 550px;
        background-color: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.2);
        transform: translate(-50%, -50%);
        top: 50%;
        left: 50%;
        border-radius: 8px;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
        cursor: pointer;
        overflow: hidden;
      }
      .card img {
        position: absolute;
        width: 300px;
        filter: drop-shadow(0 0 20px rgba(26, 0, 68, 0.34));
        bottom: 0;
        left: 120px;
        top: 10%;
        transition: 0.5s ease;
      }
      .image {
        display: block;
        width: 100%;
        height: auto;
      }
      .overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: rgba(255, 255, 255, 0.95);
        overflow: hidden;
        width: 100%;
        height: 0;
        transition: 0.5s ease;
      }
      .text-container {
        color: white;
        font-size: 20px;
        position: absolute;
        top: 50%;
        left: 50%;
        width: 60%;
        -webkit-transform: translate(-50%, -50%);
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
        text-align: center;
      }
      .card h2 {
        color: #000000;
        text-transform: uppercase;
      }
      .card p {
        font-weight: 300;
        text-align: justify;
        color: #000000;
        line-height: 1.8;
        letter-spacing: 0.3px;
      }
      /* .card:hover img {
        width: 250px;
        left: 15px;
        bottom: 20px;
      } */
      /* .card:hover .text-container {
        right: 15px;
      } */
    </style>
  </head>
  <body>
    <div class="container">
      <div class="shapes2"></div>
      <div class="card" id="card">
        <img src="../public/loveyou.PNG" />
        <div class="overlay">
          <div class="text-container">
            <h2>Happy 2 Months!</h2>
            <p>
              I'm so proud and grateful to call you mine. Thank you for your tireless love and support. I love you now and always will.
              <br />
              <small>Forever yours,<br/>Nic &#128152;</small>
            </p>
          </div>
        </div>
      </div>
      <!-- <audio controls id="audio">
        <source

        />
        Your browser does not support the audio element.
      </audio> -->
    </div>
  </body>
